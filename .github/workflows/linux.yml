name: Linux split view
on: [push, workflow_dispatch]
jobs:
  terminal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.6'
            tag: py36
          - python: '3.7'
            tag: py37
          - python: '3.9'
            tag: py39
          - python: '3.10'
            tag: py310
    steps:
      - uses: actions/checkout@v4
      - name: Extract matching offline bundle
        run: |
          unzip -q dist/ipdb-linux-${{ matrix.tag }}.zip -d /tmp/ipdb-test
          cp test_split.py /tmp/ipdb-test/ipdb-linux-${{ matrix.tag }}/
          cp test_gdb.py /tmp/ipdb-test/ipdb-linux-${{ matrix.tag }}/
          cp test_loader.py /tmp/ipdb-test/ipdb-linux-${{ matrix.tag }}/
          cp test_completion.py /tmp/ipdb-test/ipdb-linux-${{ matrix.tag }}/
          cp test_history.py /tmp/ipdb-test/ipdb-linux-${{ matrix.tag }}/
          cp test_speed.py /tmp/ipdb-test/ipdb-linux-${{ matrix.tag }}/
          cp test_browser.py /tmp/ipdb-test/ipdb-linux-${{ matrix.tag }}/
          cp test_panes.py /tmp/ipdb-test/ipdb-linux-${{ matrix.tag }}/
          cp test_reload.py /tmp/ipdb-test/ipdb-linux-${{ matrix.tag }}/
          cp test_tmux_resize.py /tmp/ipdb-test/ipdb-linux-${{ matrix.tag }}/
          cp test_input.py /tmp/ipdb-test/ipdb-linux-${{ matrix.tag }}/
      - name: Test without site packages or dependency installation
        run: >-
          docker run --rm
          -v /tmp/ipdb-test/ipdb-linux-${{ matrix.tag }}:/work
          -w /work python:${{ matrix.python }}
          python -S -B -m unittest test_split.py test_gdb.py test_loader.py test_completion.py test_input.py test_history.py test_speed.py test_browser.py test_panes.py test_reload.py test_tmux_resize.py -v

  system-vim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: sudo apt-get update && sudo apt-get install -y vim-gtk3 tmux xvfb
      - run: |
          unzip -q dist/ipdb-linux-py39.zip -d /tmp/vim-test
          cp test_source_vim.py /tmp/vim-test/ipdb-linux-py39/
          cp repro_source_render.py /tmp/vim-test/ipdb-linux-py39/
          cp test_gvim.py /tmp/vim-test/ipdb-linux-py39/
          cd /tmp/vim-test/ipdb-linux-py39
          python -B -m unittest test_source_vim -v
          xvfb-run -a python -B -m unittest test_gvim -v
          python repro_source_render.py --output /tmp/ipdb-render-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-render-screens
          path: /tmp/ipdb-render-ci
